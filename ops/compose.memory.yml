name: wanpet-memory
services:
  vector:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: wanpet_memory
      POSTGRES_USER: wanpet_memory
      POSTGRES_PASSWORD: ${MEM0_POSTGRES_PASSWORD:?Set MEM0_POSTGRES_PASSWORD in a private environment file}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - vector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wanpet_memory -d wanpet_memory"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  vector_data:
