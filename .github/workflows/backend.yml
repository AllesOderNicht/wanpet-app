name: Backend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: wanpet_test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: wanpet_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wanpet_test -d wanpet_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://wanpet_test:ci-test-only@127.0.0.1:5432/wanpet_test?connection_limit=5
      TEST_DATABASE_URL: postgresql://wanpet_test:ci-test-only@127.0.0.1:5432/wanpet_test?connection_limit=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:scaffold
      - run: npm run check:assets
      - run: npm run db:generate
      - run: npm run db:validate
      - run: npm run check:prisma-config
      - run: npm run typecheck
      - run: npm run test -w @wanpet/server
      - run: npm run db:deploy
      - run: npm run test:integration
      - run: npm run build:backend
      - run: npm audit --audit-level=high
  godot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Download pinned official Godot
        shell: bash
        run: |
          set -euo pipefail
          archive=Godot_v4.7.2-stable_linux.x86_64.zip
          curl -fL --retry 2 -o "$RUNNER_TEMP/$archive" "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/$archive"
          cd "$RUNNER_TEMP"
          echo "9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65  $archive" | sha512sum --check
          unzip -q "$archive" -d godot
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
      - run: npm run godot:check
